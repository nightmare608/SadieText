name: Android preview APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Preview mode
        type: choice
        options: [offline, firebase]
        default: offline
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973'
      - name: Configure Firebase when provided
        if: inputs.mode == 'firebase'
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            printf '%s' "$FIREBASE_CONFIG" | base64 --decode > app/google-services.json
          fi
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Build selected preview
        env:
          PREVIEW_MODE: ${{ inputs.mode || 'offline' }}
        run: |
          chmod +x gradlew
          if [ "$PREVIEW_MODE" = "offline" ]; then
            ./gradlew -PofflinePreview=true assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest
          else
            ./gradlew assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sadietext-${{ inputs.mode || 'offline' }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm ci
        working-directory: firebase
      - run: npm run emulator:test
        working-directory: firebase
  publish:
    if: github.event_name == 'push' || inputs.mode == 'offline'
    needs: [debug, rules]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sadietext-offline-debug
          path: apk
      - name: Publish installable offline preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: offline-preview-${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cp apk/app-debug.apk SadieText-Cevrimdisi.apk
          cat > release-notes.md <<EOF
          Firebase veya hesap gerektirmeyen çevrimdışı arayüz demosu.
          Gerçek kişilere mesaj göndermez; örnek mesajlar uygulama belleğinde tutulur.
          Ayrı paket: tr.sakin.chat.offline. Mevcut SadieText hesabını etkilemez.
          Bu APK debug/test imzası kullanır; üretim dağıtımı değildir.
          Kaynak kodu ve libsignal kaynak arşivi: https://github.com/${GH_REPO}/tree/${SOURCE_SHA}
          EOF
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --prerelease \
              --title "SadieText Çevrimdışı Önizleme" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" SadieText-Cevrimdisi.apk --clobber
